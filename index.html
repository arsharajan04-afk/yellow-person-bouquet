<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Animated Bouquet 💐</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    height: 100vh;
    overflow: hidden;
    background: #050505;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* Bouquet area */
.bouquet {
    width: 100%;
    max-width: 600px;
    height: 100vh;
    position: relative;
}

/* SVG */
svg {
    width: 100%;
    height: 100%;
}

/* ---------------- STEMS ---------------- */

.stem {
    fill: none;
    stroke: #174d2b;
    stroke-width: 4;
    stroke-linecap: round;

    stroke-dasharray: 500;
    stroke-dashoffset: 500;

    animation: growStem 2s ease forwards;
}

.stem:nth-child(1) {
    animation-delay: .2s;
}

.stem:nth-child(2) {
    animation-delay: .4s;
}

.stem:nth-child(3) {
    animation-delay: .6s;
}

.stem:nth-child(4) {
    animation-delay: .8s;
}

.stem:nth-child(5) {
    animation-delay: 1s;
}

@keyframes growStem {
    to {
        stroke-dashoffset: 0;
    }
}

/* ---------------- LEAVES ---------------- */

.leaf {
    fill: #24683a;
    opacity: 0;
    transform-box: fill-box;
    transform-origin: center;
    transform: scale(0);
    animation: leafAppear .7s ease forwards;
}

.leaf:nth-of-type(1) {
    animation-delay: 1.1s;
}

.leaf:nth-of-type(2) {
    animation-delay: 1.3s;
}

.leaf:nth-of-type(3) {
    animation-delay: 1.5s;
}

.leaf:nth-of-type(4) {
    animation-delay: 1.7s;
}

.leaf:nth-of-type(5) {
    animation-delay: 1.9s;
}

.leaf:nth-of-type(6) {
    animation-delay: 2.1s;
}

@keyframes leafAppear {
    to {
        opacity: 1;
        transform: scale(1);
    }
}

/* ---------------- FLOWERS ---------------- */

.flower {
    opacity: 0;
    transform-box: fill-box;
    transform-origin: center;
    transform: scale(0);
    animation: bloom 1s cubic-bezier(.2,.8,.2,1) forwards;
}

/* White flowers */
.whiteFlower {
    fill: #f5f4ed;
}

.whiteFlower:nth-of-type(1) {
    animation-delay: 2.2s;
}

.whiteFlower:nth-of-type(2) {
    animation-delay: 2.6s;
}

/* Red flower */
.redFlower {
    fill: #e74438;
    animation-delay: 3s;
}

/* Pink bud */
.pinkFlower {
    fill: #c94a78;
    animation-delay: 3.4s;
}

@keyframes bloom {
    0% {
        opacity: 0;
        transform: scale(0);
    }

    70% {
        opacity: 1;
        transform: scale(1.15);
    }

    100% {
        opacity: 1;
        transform: scale(1);
    }
}

/* Flower centers */
.center {
    fill: #f5c43b;
    opacity: 0;
    animation: centerAppear .5s ease forwards;
    animation-delay: 3.1s;
}

@keyframes centerAppear {
    to {
        opacity: 1;
    }
}

/* Little floating particles */
.particle {
    fill: #ffffff;
    opacity: 0;
    animation: floatParticle 4s infinite ease-in-out;
}

.p1 {
    animation-delay: 3s;
}

.p2 {
    animation-delay: 4s;
}

.p3 {
    animation-delay: 5s;
}

@keyframes floatParticle {
    0% {
        opacity: 0;
        transform: translateY(10px);
    }

    30% {
        opacity: .5;
    }

    70% {
        opacity: .2;
    }

    100% {
        opacity: 0;
        transform: translateY(-50px);
    }
}

/* Replay button */
.replay {
    position: absolute;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);

    padding: 10px 22px;
    border: 1px solid #ffffff55;
    border-radius: 30px;

    background: #ffffff10;
    color: white;
    font-size: 14px;

    cursor: pointer;
    backdrop-filter: blur(8px);
}

.replay:hover {
    background: #ffffff20;
}
</style>
</head>

<body>

<div class="bouquet">

<svg viewBox="0 0 600 900">

<!-- ================= STEMS ================= -->

<path class="stem"
      d="M300 820 C295 700 300 570 350 420"/>

<path class="stem"
      d="M310 820 C320 700 380 590 455 420"/>

<path class="stem"
      d="M290 820 C270 700 250 600 220 480"/>

<path class="stem"
      d="M330 820 C360 700 450 650 500 540"/>

<path class="stem"
      d="M280 820 C260 720 180 650 150 560"/>


<!-- ================= LEAVES ================= -->

<ellipse class="leaf"
         cx="270" cy="680"
         rx="12" ry="45"
         transform="rotate(-55 270 680)"/>

<ellipse class="leaf"
         cx="345" cy="650"
         rx="12" ry="45"
         transform="rotate(55 345 650)"/>

<ellipse class="leaf"
         cx="235" cy="610"
         rx="11" ry="42"
         transform="rotate(-65 235 610)"/>

<ellipse class="leaf"
         cx="390" cy="600"
         rx="11" ry="45"
         transform="rotate(55 390 600)"/>

<ellipse class="leaf"
         cx="205" cy="690"
         rx="11" ry="43"
         transform="rotate(-65 205 690)"/>

<ellipse class="leaf"
         cx="430" cy="690"
         rx="11" ry="45"
         transform="rotate(65 430 690)"/>


<!-- ================= WHITE FLOWER 1 ================= -->

<g class="flower whiteFlower"
   transform="translate(350 420)">

    <ellipse cx="0" cy="-38"
             rx="18" ry="45"/>

    <ellipse cx="0" cy="38"
             rx="18" ry="45"/>

    <ellipse cx="-38" cy="0"
             rx="45" ry="18"/>

    <ellipse cx="38" cy="0"
             rx="45" ry="18"/>

    <ellipse cx="-27" cy="-27"
             rx="16" ry="38"
             transform="rotate(-45)"/>

    <ellipse cx="27" cy="27"
             rx="16" ry="38"
             transform="rotate(-45)"/>

    <circle cx="0" cy="0"
            r="9"
            fill="#d9d5b8"/>
</g>


<!-- ================= WHITE FLOWER 2 ================= -->

<g class="flower whiteFlower"
   transform="translate(455 420)">

    <ellipse cx="0" cy="-38"
             rx="17" ry="44"/>

    <ellipse cx="0" cy="38"
             rx="17" ry="44"/>

    <ellipse cx="-38" cy="0"
             rx="44" ry="17"/>

    <ellipse cx="38" cy="0"
             rx="44" ry="17"/>

    <ellipse cx="-27" cy="-27"
             rx="15" ry="37"
             transform="rotate(-45)"/>

    <ellipse cx="27" cy="27"
             rx="15" ry="37"
             transform="rotate(-45)"/>

    <circle cx="0" cy="0"
            r="8"
            fill="#d9d5b8"/>
</g>


<!-- ================= RED FLOWER ================= -->

<g class="flower redFlower"
   transform="translate(285 500)">

    <circle cx="0" cy="-27" r="25"/>

    <circle cx="27" cy="0" r="25"/>

    <circle cx="0" cy="27" r="25"/>

    <circle cx="-27" cy="0" r="25"/>

    <circle cx="0" cy="0"
            r="12"
            fill="#f6c735"/>
</g>


<!-- ================= PINK FLOWER/BUD ================= -->

<g class="flower pinkFlower"
   transform="translate(390 350)">

    <ellipse cx="0" cy="-22"
             rx="28" ry="40"/>

    <ellipse cx="-20" cy="-5"
             rx="22" ry="34"
             transform="rotate(-25)"/>

    <ellipse cx="20" cy="-5"
             rx="22" ry="34"
             transform="rotate(25)"/>

    <ellipse cx="0" cy="15"
             rx="20" ry="30"/>

</g>


<!-- ================= PARTICLES ================= -->

<circle class="particle p1"
        cx="150" cy="350" r="3"/>

<circle class="particle p2"
        cx="480" cy="300" r="3"/>

<circle class="particle p3"
        cx="250" cy="300" r="2"/>

</svg>


<button class="replay" onclick="replayBouquet()">
    🌷 Replay
</button>

</div>


<script>

function replayBouquet() {

    const elements = document.querySelectorAll(
        ".stem, .leaf, .flower, .center, .particle"
    );

    elements.forEach(element => {

        element.style.animation = "none";

        /* Force browser to restart animation */
        void element.offsetWidth;

        element.style.animation = "";

    });

}

</script>

</body>
</html>
