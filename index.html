<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Little Surprise ❤️</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: linear-gradient(135deg, #fff8d9, #fff0f5);
  font-family: Georgia, serif;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
  color: #5a4030;
}

.container {
  width: 100%;
  max-width: 500px;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  padding: 25px;
  text-align: center;
}

/* Opening message */

.intro {
  animation: fadeOut 2s ease 4s forwards;
  position: absolute;
  z-index: 5;
}

.intro h1 {
  font-size: 28px;
  margin-bottom: 12px;
}

.intro p {
  font-size: 18px;
  font-style: italic;
}

@keyframes fadeOut {
  to {
    opacity: 0;
    visibility: hidden;
  }
}

/* Bouquet */

.bouquet-area {
  position: relative;
  width: 330px;
  height: 400px;
  margin-top: 40px;
  animation: bouquetAppear 1s ease 4.2s both;
}

@keyframes bouquetAppear {
  from {
    opacity: 0;
    transform: scale(.7);
  }
  to {
    opacity: 1;
    transform: scale(1);
  }
}

/* stems */

.stem {
  position: absolute;
  width: 6px;
  height: 230px;
  background: linear-gradient(to right, #315d32, #6e9b54);
  border-radius: 10px;
  bottom: 75px;
  left: 50%;
  transform-origin: bottom;
  animation: growStem 1.5s ease both;
}

.stem1 { transform: rotate(-25deg); animation-delay: 4.5s; }
.stem2 { transform: rotate(-12deg); animation-delay: 4.7s; }
.stem3 { transform: rotate(0deg); animation-delay: 4.9s; }
.stem4 { transform: rotate(13deg); animation-delay: 5.1s; }
.stem5 { transform: rotate(26deg); animation-delay: 5.3s; }

@keyframes growStem {
  from {
    height: 0;
  }
  to {
    height: 230px;
  }
}

/* Leaves */

.leaf {
  position: absolute;
  width: 48px;
  height: 22px;
  background: linear-gradient(135deg, #315f32, #78a85b);
  border-radius: 100% 0 100% 0;
  opacity: 0;
  animation: leafAppear .8s ease forwards;
}

.leaf1 {
  left: 70px;
  bottom: 165px;
  transform: rotate(25deg);
  animation-delay: 5.5s;
}

.leaf2 {
  left: 105px;
  bottom: 125px;
  transform: rotate(-35deg);
  animation-delay: 5.7s;
}

.leaf3 {
  right: 65px;
  bottom: 160px;
  transform: rotate(-25deg);
  animation-delay: 5.9s;
}

.leaf4 {
  right: 105px;
  bottom: 120px;
  transform: rotate(35deg);
  animation-delay: 6.1s;
}

@keyframes leafAppear {
  from {
    opacity: 0;
    transform: scale(0);
  }
  to {
    opacity: 1;
  }
}

/* Flowers */

.flower {
  position: absolute;
  width: 105px;
  height: 105px;
  opacity: 0;
  animation: bloom 1.3s cubic-bezier(.2,.8,.2,1) forwards;
}

.flower1 {
  top: 45px;
  left: 25px;
  animation-delay: 5.8s;
}

.flower2 {
  top: 15px;
  left: 112px;
  animation-delay: 6.1s;
}

.flower3 {
  top: 50px;
  right: 20px;
  animation-delay: 6.4s;
}

.flower4 {
  top: 85px;
  left: 75px;
  animation-delay: 6.7s;
}

.flower5 {
  top: 90px;
  right: 65px;
  animation-delay: 7s;
}

@keyframes bloom {
  from {
    opacity: 0;
    transform: scale(0);
  }
  to {
    opacity: 1;
    transform: scale(1);
  }
}

/* Rose-like flower */

.petal {
  position: absolute;
  width: 48px;
  height: 65px;
  background: radial-gradient(circle at 50% 35%, #fff58a, #f4c928 65%, #d79d0b);
  border-radius: 50% 50% 45% 45%;
  left: 28px;
  top: 20px;
  transform-origin: 50% 80%;
  box-shadow: inset 0 2px 5px rgba(255,255,255,.6);
}

.p1 { transform: rotate(0deg) translateY(-22px); }
.p2 { transform: rotate(72deg) translateY(-22px); }
.p3 { transform: rotate(144deg) translateY(-22px); }
.p4 { transform: rotate(216deg) translateY(-22px); }
.p5 { transform: rotate(288deg) translateY(-22px); }

.center {
  position: absolute;
  width: 35px;
  height: 35px;
  background: radial-gradient(circle, #9b6410, #d7950c);
  border-radius: 50%;
  left: 35px;
  top: 35px;
  z-index: 3;
  box-shadow: 0 2px 8px rgba(100,70,0,.3);
}

/* Wrapping paper */

.wrapper {
  position: absolute;
  bottom: 5px;
  left: 45px;
  width: 240px;
  height: 145px;
  background: linear-gradient(135deg, #fffaf0, #e8d6b5);
  clip-path: polygon(5% 0, 95% 0, 75% 100%, 25% 100%);
  z-index: 5;
  box-shadow: 0 5px 15px rgba(80,50,20,.15);
  animation: wrapperAppear 1s ease 7.4s both;
}

@keyframes wrapperAppear {
  from {
    opacity: 0;
    transform: translateY(50px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* Ribbon */

.ribbon {
  position: absolute;
  bottom: 55px;
  left: 145px;
  width: 45px;
  height: 35px;
  z-index: 8;
  animation: ribbonAppear .8s ease 8s both;
}

.ribbon:before,
.ribbon:after {
  content: "";
  position: absolute;
  width: 35px;
  height: 25px;
  background: #d88a39;
  border-radius: 70% 10% 70% 10%;
  top: 0;
}

.ribbon:before {
  left: -25px;
  transform: rotate(-25deg);
}

.ribbon:after {
  right: -25px;
  transform: scaleX(-1) rotate(-25deg);
}

.ribbon span {
  position: absolute;
  width: 15px;
  height: 15px;
  background: #c87528;
  border-radius: 50%;
  left: 15px;
  top: 5px;
}

@keyframes ribbonAppear {
  from {
    opacity: 0;
    transform: scale(0);
  }
  to {
    opacity: 1;
    transform: scale(1);
  }
}

/* Message */

.message {
  margin-top: -5px;
  opacity: 0;
  animation: messageAppear 1.5s ease 8.5s forwards;
  z-index: 10;
}

.message h2 {
  font-size: 24px;
  color: #bd7b16;
  margin: 8px 0;
}

.message p {
  font-size: 21px;
  margin: 5px;
}

.heart {
  display: inline-block;
  animation: heartbeat 1.2s infinite;
}

@keyframes heartbeat {
  50% {
    transform: scale(1.25);
  }
}

@keyframes messageAppear {
  from {
    opacity: 0;
    transform: translateY(20px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* Floating hearts */

.floating-heart {
  position: fixed;
  font-size: 20px;
  opacity: 0;
  animation: floatUp 6s linear infinite;
}

.h1 { left: 10%; animation-delay: 2s; }
.h2 { left: 80%; animation-delay: 4s; }
.h3 { left: 25%; animation-delay: 6s; }
.h4 { left: 65%; animation-delay: 8s; }

@keyframes floatUp {
  0% {
    bottom: -30px;
    opacity: 0;
  }
  20% {
    opacity: .8;
  }
  100% {
    bottom: 110%;
    opacity: 0;
    transform: translateX(30px) rotate(20deg);
  }
}
</style>
</head>

<body>

<div class="container">

  <!-- Opening -->
  <div class="intro">
    <h1>Hey my dear annachii 🐒🐷</h1>
    <p>A little something for you… ❤️</p>
  </div>

  <!-- Floating hearts -->
  <div class="floating-heart h1">❤️</div>
  <div class="floating-heart h2">💛</div>
  <div class="floating-heart h3">❤️</div>
  <div class="floating-heart h4">💛</div>

  <!-- Bouquet -->
  <div class="bouquet-area">

    <div class="stem stem1"></div>
    <div class="stem stem2"></div>
    <div class="stem stem3"></div>
    <div class="stem stem4"></div>
    <div class="stem stem5"></div>

    <div class="leaf leaf1"></div>
    <div class="leaf leaf2"></div>
    <div class="leaf leaf3"></div>
    <div class="leaf leaf4"></div>

    <!-- Flower 1 -->
    <div class="flower flower1">
      <div class="petal p1"></div>
      <div class="petal p2"></div>
      <div class="petal p3"></div>
      <div class="petal p4"></div>
      <div class="petal p5"></div>
      <div class="center"></div>
    </div>

    <!-- Flower 2 -->
    <div class="flower flower2">
      <div class="petal p1"></div>
      <div class="petal p2"></div>
      <div class="petal p3"></div>
      <div class="petal p4"></div>
      <div class="petal p5"></div>
      <div class="center"></div>
    </div>

    <!-- Flower 3 -->
    <div class="flower flower3">
      <div class="petal p1"></div>
      <div class="petal p2"></div>
      <div class="petal p3"></div>
      <div class="petal p4"></div>
      <div class="petal p5"></div>
      <div class="center"></div>
    </div>

    <!-- Flower 4 -->
    <div class="flower flower4">
      <div class="petal p1"></div>
      <div class="petal p2"></div>
      <div class="petal p3"></div>
      <div class="petal p4"></div>
      <div class="petal p5"></div>
      <div class="center"></div>
    </div>

    <!-- Flower 5 -->
    <div class="flower flower5">
      <div class="petal p1"></div>
      <div class="petal p2"></div>
      <div class="petal p3"></div>
      <div class="petal p4"></div>
      <div class="petal p5"></div>
      <div class="center"></div>
    </div>

    <div class="wrapper"></div>

    <div class="ribbon">
      <span></span>
    </div>

  </div>

  <!-- Final message -->
  <div class="message">
    <h2>You are my yellow person.. <span class="heart">❤️</span></h2>
    <p>I love you 😘🫂</p>
  </div>

</div>

</body>
</html>
