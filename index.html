<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>A Little Surprise 💐</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    overflow: hidden;
    background:
        radial-gradient(circle at 50% 45%, #24151d 0%, #0b080b 45%, #030303 100%);
    color: white;
    font-family: Georgia, "Times New Roman", serif;
}

/* ---------- OPENING SCREEN ---------- */

.intro {
    position: fixed;
    inset: 0;
    z-index: 20;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 25px;

    background:
        radial-gradient(circle, #281720 0%, #080609 70%);
    
    animation: introFade 1.2s ease 5.5s forwards;
    pointer-events: auto;
}

.intro h1 {
    font-size: clamp(25px, 7vw, 43px);
    margin: 0 0 15px;
    font-weight: normal;
    letter-spacing: 1px;
    animation: textAppear 1.5s ease forwards;
}

.intro p {
    margin: 0;
    font-size: clamp(17px, 4.5vw, 23px);
    color: #e8c9d4;
    animation: textAppear 1.5s ease .5s both;
}

.tap {
    margin-top: 35px;
    font-family: Arial, sans-serif;
    font-size: 13px;
    letter-spacing: 2px;
    color: #aaa;
    animation: pulse 2s infinite 2s;
}

@keyframes textAppear {
    from {
        opacity: 0;
        transform: translateY(20px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes introFade {
    to {
        opacity: 0;
        visibility: hidden;
    }
}

@keyframes pulse {
    50% {
        opacity: .4;
    }
}

/* ---------- BOUQUET ---------- */

.bouquet {
    width: 100%;
    max-width: 650px;
    height: 100vh;
    margin: auto;
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
}

svg {
    width: 100%;
    height: 100%;
}

/* ---------- STEMS ---------- */

.stem {
    fill: none;
    stroke: #245b32;
    stroke-width: 5;
    stroke-linecap: round;

    stroke-dasharray: 600;
    stroke-dashoffset: 600;

    animation: growStem 2s ease forwards;
}

.stem:nth-of-type(1) { animation-delay: 1s; }
.stem:nth-of-type(2) { animation-delay: 1.2s; }
.stem:nth-of-type(3) { animation-delay: 1.4s; }
.stem:nth-of-type(4) { animation-delay: 1.6s; }
.stem:nth-of-type(5) { animation-delay: 1.8s; }
.stem:nth-of-type(6) { animation-delay: 2s; }
.stem:nth-of-type(7) { animation-delay: 2.2s; }
.stem:nth-of-type(8) { animation-delay: 2.4s; }

@keyframes growStem {
    to {
        stroke-dashoffset: 0;
    }
}

/* ---------- LEAVES ---------- */

.leaf {
    fill: #327343;
    opacity: 0;
    transform-box: fill-box;
    transform-origin: center;
    transform: scale(0);
    animation: leafAppear .7s ease forwards;
}

.leaf:nth-of-type(1) { animation-delay: 2.3s; }
.leaf:nth-of-type(2) { animation-delay: 2.5s; }
.leaf:nth-of-type(3) { animation-delay: 2.7s; }
.leaf:nth-of-type(4) { animation-delay: 2.9s; }
.leaf:nth-of-type(5) { animation-delay: 3.1s; }
.leaf:nth-of-type(6) { animation-delay: 3.3s; }
.leaf:nth-of-type(7) { animation-delay: 3.5s; }
.leaf:nth-of-type(8) { animation-delay: 3.7s; }
.leaf:nth-of-type(9) { animation-delay: 3.9s; }
.leaf:nth-of-type(10) { animation-delay: 4.1s; }

@keyframes leafAppear {
    to {
        opacity: 1;
        transform: scale(1);
    }
}

/* ---------- ALL FLOWERS ---------- */

.flower {
    opacity: 0;
    transform-box: fill-box;
    transform-origin: center;
    transform: scale(0);
    animation: bloom 1.1s cubic-bezier(.2,.8,.2,1) forwards;
}

@keyframes bloom {
    0% {
        opacity: 0;
        transform: scale(0);
    }

    65% {
        opacity: 1;
        transform: scale(1.15);
    }

    100% {
        opacity: 1;
        transform: scale(1);
    }
}

/* ---------- ROSES ---------- */

.rosePetal {
    fill: #d9364f;
}

.roseLight {
    fill: #ef5266;
}

.roseDark {
    fill: #a91f38;
}

/* ---------- TULIPS ---------- */

.tulipPetal {
    fill: #f2c84b;
}

.tulipOrange {
    fill: #f28b3d;
}

.tulipPink {
    fill: #e76b8a;
}

/* ---------- LILIES ---------- */

.lily {
    fill: #fff8ed;
}

.lilyPink {
    fill: #f4d7df;
}

.lilyCenter {
    fill: #e6b83d;
}

/* ---------- VIOLETS ---------- */

.violet {
    fill: #7950a8;
}

.violetLight {
    fill: #9a72c5;
}

.violetCenter {
    fill: #f0c84b;
}

/* ---------- FLOWER TIMINGS ---------- */

.rose1 { animation-delay: 4.2s; }
.rose2 { animation-delay: 4.6s; }
.rose3 { animation-delay: 5s; }

.tulip1 { animation-delay: 5.4s; }
.tulip2 { animation-delay: 5.8s; }

.lily1 { animation-delay: 6.2s; }
.lily2 { animation-delay: 6.6s; }

.violet1 { animation-delay: 7s; }
.violet2 { animation-delay: 7.4s; }
.violet3 { animation-delay: 7.8s; }

/* ---------- FLOWER CENTERS ---------- */

.center {
    opacity: 0;
    animation: centerAppear .5s ease forwards;
    animation-delay: 8s;
}

@keyframes centerAppear {
    to {
        opacity: 1;
    }
}

/* ---------- WRAP ---------- */

.wrap {
    fill: #d7b28a;
    opacity: 0;
    transform-origin: center;
    transform-box: fill-box;
    transform: scaleY(0);
    animation: wrapAppear 1s ease 8.3s forwards;
}

@keyframes wrapAppear {
    to {
        opacity: 1;
        transform: scaleY(1);
    }
}

.ribbon {
    fill: #c94b68;
    opacity: 0;
    animation: ribbonAppear .8s ease 9s forwards;
}

@keyframes ribbonAppear {
    to {
        opacity: 1;
    }
}

/* ---------- SPARKLES ---------- */

.sparkle {
    fill: white;
    opacity: 0;
    animation: sparkle 3s infinite ease-in-out;
}

.s1 { animation-delay: 8s; }
.s2 { animation-delay: 8.7s; }
.s3 { animation-delay: 9.4s; }
.s4 { animation-delay: 10.1s; }
.s5 { animation-delay: 10.8s; }

@keyframes sparkle {
    0%,100% {
        opacity: 0;
        transform: translateY(12px) scale(.5);
    }

    40% {
        opacity: .8;
        transform: translateY(0) scale(1);
    }

    70% {
        opacity: .3;
    }
}

/* ---------- FINAL MESSAGE ---------- */

.message {
    position: absolute;
    left: 50%;
    bottom: 75px;
    transform: translateX(-50%) translateY(20px);
    width: 90%;
    text-align: center;

    opacity: 0;
    animation: messageAppear 1.5s ease 9.5s forwards;
}

.message .yellow {
    font-size: clamp(20px, 5vw, 29px);
    color: #f5c94a;
    text-shadow: 0 0 15px #f5c94a55;
}

.message .love {
    margin-top: 10px;
    font-size: clamp(18px, 4.5vw, 25px);
    color: #f3dce3;
}

@keyframes messageAppear {
    to {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
    }
}

/* ---------- REPLAY ---------- */

.replay {
    position: absolute;
    bottom: 18px;
    left: 50%;
    transform: translateX(-50%);

    padding: 9px 20px;
    border: 1px solid #ffffff35;
    border-radius: 30px;

    background: #ffffff0d;
    color: #ddd;

    font-size: 13px;
    cursor: pointer;
    backdrop-filter: blur(8px);

    opacity: 0;
    animation: buttonAppear 1s ease 10s forwards;
}

.replay:hover {
    background: #ffffff18;
}

@keyframes buttonAppear {
    to {
        opacity: 1;
    }
}

/* ---------- MOBILE ---------- */

@media (max-width: 500px) {

    .bouquet {
        height: 100svh;
    }

    svg {
        transform: scale(.92);
    }

    .message {
        bottom: 70px;
    }
}
</style>

<script>

function replayBouquet() {

    /* Restart the whole page animation */
    document.querySelector(".intro").style.animation = "none";

    const elements = document.querySelectorAll(
        ".stem, .leaf, .flower, .center, .wrap, .ribbon, .sparkle, .message, .replay"
    );

    elements.forEach(element => {
        element.style.animation = "none";

        /* Force browser to restart animation */
        void element.offsetWidth;

        element.style.animation = "";
    });

    /* Restart opening screen */
    const intro = document.querySelector(".intro");

    intro.style.visibility = "visible";
    intro.style.opacity = "1";
    intro.style.animation = "introFade 1.2s ease 5.5s forwards";
}

</script>
