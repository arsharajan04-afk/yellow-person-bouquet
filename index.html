<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>A Little Surprise 💐</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    overflow: hidden;
    font-family: Georgia, serif;
    background: linear-gradient(135deg, #fff5f7, #ffeef2, #fffaf3);
    display: flex;
    justify-content: center;
    align-items: center;
    color: #5b3540;
}

.screen {
    text-align: center;
    width: 100%;
    padding: 25px;
}

.intro {
    animation: fadeIn 2s ease;
}

.intro h1 {
    font-size: clamp(25px, 7vw, 45px);
    margin-bottom: 15px;
}

.intro p {
    font-size: clamp(17px, 4vw, 23px);
    margin: 8px;
}

button {
    margin-top: 25px;
    border: none;
    border-radius: 30px;
    padding: 13px 28px;
    font-size: 17px;
    background: #e8899d;
    color: white;
    cursor: pointer;
    box-shadow: 0 5px 15px #d99aaa;
}

button:active {
    transform: scale(.96);
}

/* Bouquet area */

.bouquet-screen {
    display: none;
}

.bouquet {
    position: relative;
    width: 330px;
    height: 470px;
    margin: auto;
}

/* paper */

.wrapper {
    position: absolute;
    bottom: 15px;
    left: 50%;
    transform: translateX(-50%);
    width: 260px;
    height: 180px;
    background: linear-gradient(135deg, #fffdf8, #f5e7d7);
    clip-path: polygon(8% 0, 92% 0, 100% 100%, 0 100%);
    border-radius: 10px;
    box-shadow: 0 8px 20px rgba(0,0,0,.15);
    z-index: 2;
}

.ribbon {
    position: absolute;
    bottom: 80px;
    left: 50%;
    transform: translateX(-50%);
    width: 95px;
    height: 30px;
    background: #d98b9d;
    border-radius: 10px;
    z-index: 8;
}

.ribbon:before,
.ribbon:after {
    content: "";
    position: absolute;
    top: 4px;
    width: 65px;
    height: 35px;
    background: #d98b9d;
}

.ribbon:before {
    right: 65px;
    transform: rotate(25deg);
}

.ribbon:after {
    left: 65px;
    transform: rotate(-25deg);
}

/* stems */

.stem {
    position: absolute;
    width: 7px;
    height: 230px;
    background: #4f8b55;
    bottom: 90px;
    left: 50%;
    transform-origin: bottom;
    border-radius: 10px;
    z-index: 1;
}

/* leaves */

.leaf {
    position: absolute;
    width: 65px;
    height: 28px;
    background: #5f9c61;
    border-radius: 100% 0 100% 0;
    bottom: 170px;
    z-index: 3;
}

/* flowers */

.flower {
    position: absolute;
    z-index: 6;
    opacity: 0;
    animation: appear 1s ease forwards;
}

/* ROSE */

.rose {
    width: 70px;
    height: 70px;
    border-radius: 50%;
    background:
        radial-gradient(circle at 50% 50%, #7d1f32 0 10%, transparent 11%),
        radial-gradient(circle at 30% 40%, #d94d68 0 20%, transparent 21%),
        radial-gradient(circle at 70% 40%, #c93655 0 22%, transparent 23%),
        radial-gradient(circle at 35% 70%, #ef7086 0 25%, transparent 26%),
        radial-gradient(circle at 70% 70%, #d94d68 0 24%, transparent 25%),
        #b72e49;
    box-shadow: inset 0 0 12px rgba(80,0,20,.4);
}

/* TULIP */

.tulip {
    width: 62px;
    height: 68px;
    background: linear-gradient(90deg, #e56b82, #ff9caf, #d94d67);
    border-radius: 50% 50% 45% 45%;
    clip-path: polygon(
        0 0, 20% 28%, 35% 0,
        50% 30%, 67% 0, 82% 28%,
        100% 0, 92% 75%, 70% 100%,
        30% 100%, 8% 75%
    );
}

/* LILY */

.lily {
    width: 85px;
    height: 85px;
    background:
        radial-gradient(circle at center, #d98a9d 0 5%, transparent 6%),
        radial-gradient(ellipse at center, #fff 0 35%, #fff0f5 36% 60%, transparent 61%);
    clip-path: polygon(
        50% 0,
        62% 30%,
        100% 20%,
        72% 50%,
        100% 80%,
        60% 68%,
        50% 100%,
        40% 68%,
        0 80%,
        28% 50%,
        0 20%,
        38% 30%
    );
}

/* VIOLET */

.violet {
    width: 58px;
    height: 58px;
    background:
        radial-gradient(circle, #f7dffb 0 10%, transparent 11%),
        radial-gradient(circle at 50% 10%, #7743a8 0 28%, transparent 29%),
        radial-gradient(circle at 90% 40%, #8e5bc0 0 28%, transparent 29%),
        radial-gradient(circle at 70% 90%, #7743a8 0 28%, transparent 29%),
        radial-gradient(circle at 30% 90%, #8e5bc0 0 28%, transparent 29%),
        radial-gradient(circle at 10% 40%, #7743a8 0 28%, transparent 29%);
    border-radius: 50%;
}

/* small filler flowers */

.filler {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: white;
    box-shadow:
        0 -12px 0 -3px white,
        12px 0 0 -3px white,
        0 12px 0 -3px white,
        -12px 0 0 -3px white;
}

/* positions */

.r1 { left: 130px; bottom: 250px; }
.r2 { left: 45px; bottom: 220px; transform: scale(.85); }
.r3 { right: 40px; bottom: 220px; transform: scale(.85); }

.t1 { left: 95px; bottom: 300px; transform: rotate(-12deg); }
.t2 { right: 90px; bottom: 300px; transform: rotate(12deg); }
.t3 { left: 135px; bottom: 325px; transform: scale(.85); }

.l1 { left: 120px; bottom: 355px; }
.l2 { left: 190px; bottom: 340px; transform: scale(.75); }

.v1 { left: 55px; bottom: 290px; }
.v2 { right: 55px; bottom: 285px; transform: scale(.85); }
.v3 { left: 160px; bottom: 280px; transform: scale(.7); }

.f1 { left: 35px; bottom: 310px; }
.f2 { right: 25px; bottom: 330px; }
.f3 { left: 80px; bottom: 355px; }
.f4 { right: 80px; bottom: 365px; }

.message {
    opacity: 0;
    margin-top: 8px;
    animation: messageIn 2s ease forwards;
    animation-delay: 5.5s;
}

.message h2 {
    font-size: clamp(22px, 6vw, 32px);
    margin: 5px;
}

.message p {
    font-size: 19px;
    margin: 8px;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(80px) scale(.5);
    }
    to {
        opacity: 1;
    }
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
}

@keyframes messageIn {
    from { opacity: 0; transform: translateY(15px); }
    to { opacity: 1; transform: translateY(0); }
}
</style>
</head>

<body>

<div class="screen intro" id="intro">

    <h1>Hey my dear annachii 🐒🐷..</h1>

    <p>A little something for you… 💐</p>

    <button onclick="startBouquet()">Open your surprise 💌</button>

</div>


<div class="screen bouquet-screen" id="bouquetScreen">

    <div class="bouquet">

        <!-- stems -->
        <div class="stem" style="transform:rotate(-25deg)"></div>
        <div class="stem" style="transform:rotate(-12deg)"></div>
        <div class="stem"></div>
        <div class="stem" style="transform:rotate(13deg)"></div>
        <div class="stem" style="transform:rotate(25deg)"></div>

        <!-- leaves -->
        <div class="leaf" style="left:30px; transform:rotate(-35deg)"></div>
        <div class="leaf" style="left:225px; transform:rotate(35deg)"></div>
        <div class="leaf" style="left:75px; bottom:135px; transform:rotate(-20deg)"></div>
        <div class="leaf" style="left:185px; bottom:140px; transform:rotate(20deg)"></div>

        <!-- roses -->
        <div class="flower rose r1" style="animation-delay:.4s"></div>
        <div class="flower rose r2" style="animation-delay:1.1s"></div>
        <div class="flower rose r3" style="animation-delay:1.5s"></div>

        <!-- tulips -->
        <div class="flower tulip t1" style="animation-delay:1.8s"></div>
        <div class="flower tulip t2" style="animation-delay:2.2s"></div>
        <div class="flower tulip t3" style="animation-delay:2.5s"></div>

        <!-- lilies -->
        <div class="flower lily l1" style="animation-delay:2.8s"></div>
        <div class="flower lily l2" style="animation-delay:3.1s"></div>

        <!-- violets -->
        <div class="flower violet v1" style="animation-delay:3.5s"></div>
        <div class="flower violet v2" style="animation-delay:3.8s"></div>
        <div class="flower violet v3" style="animation-delay:4.1s"></div>

        <!-- filler flowers -->
        <div class="flower filler f1" style="animation-delay:4.3s"></div>
        <div class="flower filler f2" style="animation-delay:4.5s"></div>
        <div class="flower filler f3" style="animation-delay:4.7s"></div>
        <div class="flower filler f4" style="animation-delay:4.9s"></div>

        <!-- wrapping -->
        <div class="wrapper"></div>
        <div class="ribbon"></div>

    </div>

    <div class="message">

        <h2>You are my yellow person.. 💛</h2>

        <p>I love you 😘🫂</p>

    </div>

</div>


<script>

function startBouquet() {

    document.getElementById("intro").style.display = "none";

    document.getElementById("bouquetScreen").style.display = "block";

}

</script>

</body>
</html>
